# Build, test and package zephyrd for Linux x86_64, Linux AArch64, macOS x86_64, macOS arm64
# and Windows x86_64 from one commit.
#
# Runs (contrib/myzephyr/run-identity.py holds the table; anything else fails in the
# first step of every job):
#   push to ci/daemon-release-baseline or to my/<name>   builds GITHUB_SHA
#   pull request into my/<name>                          builds the pull request's head
#                                                        commit, never GitHub's test merge
# MYZ_BUILD_SHA (below) is that commit. Every job checks out exactly it with fetch-depth 1
# and no tags, then contrib/myzephyr/ci-checkout.sh checks the run identity, completes the
# history with "git fetch --no-tags --unshallow", proves for a pull request that the test
# merge commit (whose workflow file GitHub runs) has the head's tree and the parents base
# and head, and fails if any tag is in the checkout. No build depends on a tag:
# cmake/GitVersion.cmake prints "release" when a tag points at HEAD, and no checkout here
# has one, so every binary reports <version>-<9 hex of MYZ_BUILD_SHA>; "release" is
# refused by every checker. A pull request from a branch under my/ or from
# ci/daemon-release-baseline is refused: that branch already has its own push run.
# ci-checkout.sh also fetches the signed zephyr-backports base tag into a ref outside
# refs/tags, in every job, and no fetch recurses into submodules (the submodules stay at the
# commits actions/checkout put them on). The compiling jobs use separate checkouts
# (src-release, src-tests, src-cross) and run
# contrib/myzephyr/verify-source.sh before building: base tag object and signature
# (pinned primary fingerprint), HEAD = MYZ_BUILD_SHA, base ancestry, every own commit above
# the base (no merges, "Origin: myzephyr", maintainer signature with pinned primary
# fingerprint, allowed paths only), no tag at HEAD, submodule pins and a clean tree.
#
# Gates, each its own job, none skipped or allowed to fail silently:
#   tooling-selftest  self-tests of the start-check harness, the unit-test judge, the
#                     unit-test preflight, the artifact verifier, the platform start
#                     mechanics, the cross-target checks and the source verification
#   release-build     portable Release build, ELF/runtime-requirement checks, manifest
#   unit-tests        separate TESTS=1 (Debug) depends build in the builder image; the same
#                     unit_tests binary then runs natively on the runner (inventory, XML,
#                     environment record with binary hashes and the root filesystem)
#   runtime-offline   strict offline start on ubuntu-24.04 and in the Debian 11 builder userland
#   bootstrap         default public peer discovery from an empty directory (no peer options)
#   cross-build       Linux AArch64, macOS x86_64, macOS arm64 and Windows x86_64 cross builds
#                     in the pinned cross builder image (contrib/myzephyr/cross; for AArch64
#                     one hash-guarded GCC header fix, see its Dockerfile), static checks of the
#                     binary format (for macOS arm64 also its ad-hoc code signature) and
#                     embedded strings, manifest (nothing is executed)
#   package           needs every job above: downloads and verifies the five artifacts again,
#                     packs one archive per platform named after contrib/myzephyr/release/NAME
#                     (binary, LICENSE, THIRD-PARTY-LICENSES from the build's link inventory,
#                     README.txt), SHA256SUMS over the five archives and a manifest per platform
#                     (contrib/myzephyr/release/make-release-set.py) and uploads them as the
#                     release set (90 days on pushes to my/**); on a push it also
#                     reports the binary hashes of the pull-request run of the same commit
#   native-runtime    each cross artifact on a hosted runner of its platform
#                     (ubuntu-24.04-arm, macos-15-intel, macos-26 on Apple Silicon,
#                     windows-2022): own source
#                     verification and static checks, verify-cross-artifact.py, the platform
#                     self-test, --version, strict offline start (for AArch64 also in a
#                     runtime-only Debian 11 arm64 userland), default discovery
# Logs and artifacts are uploaded even when a gate fails; artifact names carry the
# commit. The jobs that download the release artifact verify it before use, each on its
# own: verify-source.sh on their own checkout (signatures, history, identity),
# check-elf.sh on the downloaded binary, then verify-artifact.py, which compares the
# artifact's checksums, manifest and records with those results, the pinned base policy
# and this job's own run context (repository, ref, workflow, run ID and attempt).
name: daemon-release-baseline

on:
  push:
    branches: [ci/daemon-release-baseline, "my/**"]
  pull_request:
    branches: ["my/**"]

# The only permission in this workflow. Pull requests from forks get a read-only token and
# no secrets; this workflow uses no secret.
permissions:
  contents: read

concurrency:
  group: daemon-release-baseline-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BASE_REPOSITORY_URL: https://github.com/zephyr-backports/zephyr.git
  BASE_TAG: v2.3.0-sec.2
  BASE_COMMIT: 8c6a120256b4bd887d6e7167d929d76e3507e0e5
  BASE_TAG_OBJECT: b84129b0d914c60d4dea506ca01f30091c31e9e1
  BASE_FINGERPRINT: FB3994F0997CA6F043D724919EFF03F527D240A1
  MAINTAINER_FINGERPRINT: 31DA39AB43E0CA67F1F3A661BA2AFF22DF8A4A13
  EXPECTED_UNIT_TESTS_PASSED: "1006"
  RETENTION_DAYS: "14"
  # the built commit: the pushed commit, or the head commit of a pull request
  MYZ_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  tooling-selftest:
    name: tooling self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the built commit (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: tooling
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Check the run identity, complete the history without tags
        run: mkdir -p "$RUNNER_TEMP/out" && bash tooling/contrib/myzephyr/ci-checkout.sh tooling "$RUNNER_TEMP/out/checkout-record.txt"
      - name: Run-identity table self-test (synthetic identities, one changed value per case)
        run: python3 -I tooling/contrib/myzephyr/tests/run-identity-selftest.py "$RUNNER_TEMP/out/run-identity"
      - name: Checkout completion self-test (local origin with tags and merge refs, file URL)
        if: always()
        run: |
          bash tooling/contrib/myzephyr/tests/ci-checkout-selftest.sh "$RUNNER_TEMP/ci-checkout" \
            | tee "$RUNNER_TEMP/out/ci-checkout-selftest.txt"
      - name: Link inventory self-test (synthetic tree linked by the runner's gcc and GNU ld)
        if: always()
        run: |
          bash tooling/contrib/myzephyr/tests/link-inventory-selftest.sh "$RUNNER_TEMP/link-inventory" \
            | tee "$RUNNER_TEMP/out/link-inventory-selftest.txt"
      - name: Release set self-test (synthetic artifacts, one change per case; run comparison against a stub)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/tests/release-set-selftest.py "$RUNNER_TEMP/out/release-set"
      - name: Draft release script self-test (stub gh, throwaway keys, synthetic repository, tag and release set)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/tests/draft-release-selftest.py "$RUNNER_TEMP/out/draft-release"
      - name: Harness self-test
        if: always()
        run: python3 -I tooling/contrib/myzephyr/tests/harness-selftest.py "$RUNNER_TEMP/out/harness"
      - name: Unit-test judge self-test (fixed fixtures, not daemon results)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/tests/unit-summary-selftest.py "$RUNNER_TEMP/out/unit-summary"
      - name: Unit-test preflight self-test (stub commands and test executable, not daemon results)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/tests/unit-preflight-selftest.py "$RUNNER_TEMP/out/unit-preflight"
      - name: Platform self-test of the start checks (stub child, Linux stop mechanism)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/tests/platform-selftest.py "$RUNNER_TEMP/out/platform"
      - name: Source verification self-test (repository and keys made by the test; split equal to git's)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          bash tooling/contrib/myzephyr/tests/verify-source-selftest.sh "$RUNNER_TEMP/verify-source" \
            | tee "$RUNNER_TEMP/out/verify-source-selftest.txt"
      - name: Cross-target checks self-test (synthetic binaries from measured metadata, one change per case)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/tests/cross-selftest.py "$RUNNER_TEMP/out/cross"
      - name: Artifact verifier self-test (metadata of run 42543200624, placeholder binary, one change per case)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I tooling/contrib/myzephyr/tests/artifact-verify-selftest.py "$RUNNER_TEMP/artifact-verify" \
            | tee "$RUNNER_TEMP/out/artifact-verify-selftest.txt"
          cp "$RUNNER_TEMP/artifact-verify/results.json" "$RUNNER_TEMP/out/artifact-verify-selftest.json"
      - name: Upload path check self-test (trees made by the test, outside the uploaded directory)
        if: always()
        run: |
          python3 -I tooling/contrib/myzephyr/tests/upload-paths-selftest.py "$RUNNER_TEMP/upload-paths" \
            | tee "$RUNNER_TEMP/out/upload-paths-selftest.txt"
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/check-upload-paths.py --strict --allow-missing "$RUNNER_TEMP/out"
      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tooling-selftest-${{ env.MYZ_BUILD_SHA }}
          path: ${{ runner.temp }}/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: warn

  release-build:
    name: release build (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out the built commit with submodules (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: src-release
          fetch-depth: 1
          fetch-tags: false
          submodules: recursive
          persist-credentials: false
      - name: Verify the source (base tag, own commits, head, tree)
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          bash src-release/contrib/myzephyr/ci-checkout.sh src-release "$out/checkout-record.txt"
          src-release/contrib/myzephyr/verify-source.sh --checkout src-release --expected-head "$MYZ_BUILD_SHA" \
            --base-tag "$BASE_TAG" --base-ref "refs/myzephyr-base/$BASE_TAG" --base-commit "$BASE_COMMIT" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-repository "$BASE_REPOSITORY_URL" \
            --base-key src-release/contrib/myzephyr/keys/zephyr-backports-release.asc --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-key src-release/contrib/myzephyr/keys/myzephyr-maintainer.asc --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" \
            --out "$out/source-identity.txt"
          cat "$out/source-identity.txt"
          python3 -I src-release/contrib/myzephyr/zephyrd-check.py expected-version --checkout src-release > "$out/expected-version.txt"
          cat "$out/expected-version.txt"
      - name: Build (depends, configure, target daemon)
        run: JOBS=4 src-release/contrib/myzephyr/linux/run-builder.sh docker release src-release "$RUNNER_TEMP/out/build-logs"
      - name: Check ELF runtime requirements
        run: src-release/contrib/myzephyr/check-elf.sh src-release/build/release/bin/zephyrd "$RUNNER_TEMP/out/elf-report.txt"
      - name: Check version output against the expected version
        run: |
          out="$RUNNER_TEMP/out"
          src-release/build/release/bin/zephyrd --version > "$out/version.txt"
          cat "$out/version.txt"
          v=$(cat "$out/expected-version.txt")
          test "$(wc -l < "$out/version.txt")" = 1
          [[ "$(cat "$out/version.txt")" == "Zephyr '"*"' (v$v)" ]]
      - name: Write manifest and stage artifact
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          bin=src-release/build/release/bin/zephyrd
          test -x "$bin" || { echo "no binary was built"; exit 1; }
          cp "$bin" "$out/zephyrd"
          test -f "$out/version.txt" || "$bin" --version > "$out/version.txt"
          test -f "$out/elf-report.txt" || src-release/contrib/myzephyr/check-elf.sh "$bin" "$out/elf-report.txt" || true
          python3 -I src-release/contrib/myzephyr/make-manifest.py --source-identity "$out/source-identity.txt" \
            --expected-version "$out/expected-version.txt" --builder-logs "$out/build-logs" \
            --elf-report "$out/elf-report.txt" --binary "$out/zephyrd" --version-output "$out/version.txt" \
            --build-dir src-release/build/release --recipe-dir src-release/contrib/myzephyr/linux \
            --checkout-record "$out/checkout-record.txt" --out "$out/manifest.json"
          ( cd "$out" && sha256sum zephyrd manifest.json expected-version.txt source-identity.txt > SHA256SUMS )
          cat "$out/SHA256SUMS"
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: python3 -I src-release/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/out"
      - name: Upload release artifact and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zephyrd-linux-x86_64-${{ env.MYZ_BUILD_SHA }}
          path: ${{ runner.temp }}/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Name the binary hash for the run comparison
        id: hash
        run: |
          mkdir -p "$RUNNER_TEMP/marker"
          ( cd "$RUNNER_TEMP/out" && sha256sum zephyrd ) | tee "$RUNNER_TEMP/marker/binary-sha256.txt"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/marker/binary-sha256.txt")" >> "$GITHUB_OUTPUT"
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        run: python3 -I src-release/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/marker"
      - name: Upload the hash marker (its name carries the hash; read by a later push run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-sha256-linux-x86_64-${{ steps.hash.outputs.sha256 }}
          path: ${{ runner.temp }}/marker
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  unit-tests:
    name: unit tests (depends TESTS=1, Debug; run natively)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out the built commit with submodules (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: src-tests
          fetch-depth: 1
          fetch-tags: false
          submodules: recursive
          persist-credentials: false
      - name: Verify the source (base tag, own commits, head, tree)
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          bash src-tests/contrib/myzephyr/ci-checkout.sh src-tests "$out/checkout-record.txt"
          src-tests/contrib/myzephyr/verify-source.sh --checkout src-tests --expected-head "$MYZ_BUILD_SHA" \
            --base-tag "$BASE_TAG" --base-ref "refs/myzephyr-base/$BASE_TAG" --base-commit "$BASE_COMMIT" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-repository "$BASE_REPOSITORY_URL" \
            --base-key src-tests/contrib/myzephyr/keys/zephyr-backports-release.asc --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-key src-tests/contrib/myzephyr/keys/myzephyr-maintainer.asc --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" \
            --out "$out/source-identity.txt"
          cat "$out/source-identity.txt"
      - name: Build tests (depends TESTS=1, unit_tests, test_notifier)
        run: JOBS=4 src-tests/contrib/myzephyr/linux/run-builder.sh docker tests src-tests "$RUNNER_TEMP/out/build-logs"
      - name: Run the built unit tests natively on the runner (all enabled tests, zero failures or skips, reference count)
        run: |
          EXPECTED_PASSED="$EXPECTED_UNIT_TESTS_PASSED" \
            src-tests/contrib/myzephyr/linux/run-unit-tests.sh native src-tests "$RUNNER_TEMP/out/unit-tests"
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: python3 -I src-tests/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/out"
      - name: Upload test logs, inventory and XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-linux-x86_64-${{ env.MYZ_BUILD_SHA }}
          path: ${{ runner.temp }}/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  runtime-offline:
    name: offline start (${{ matrix.userland }})
    needs: [tooling-selftest, release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        userland: [ubuntu-24.04-host, debian-11-builder-image]
    steps:
      - name: Check out the built commit with submodules (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: tooling
          fetch-depth: 1
          fetch-tags: false
          submodules: recursive
          persist-credentials: false
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zephyrd-linux-x86_64-${{ env.MYZ_BUILD_SHA }}
          path: art
      - name: Verify the source independently (base tag, own commits, head, tree)
        run: |
          v="$RUNNER_TEMP/out/artifact-verification"; mkdir -p "$v"
          bash tooling/contrib/myzephyr/ci-checkout.sh tooling "$v/checkout-record.txt"
          tooling/contrib/myzephyr/verify-source.sh --checkout tooling --expected-head "$MYZ_BUILD_SHA" \
            --base-tag "$BASE_TAG" --base-ref "refs/myzephyr-base/$BASE_TAG" --base-commit "$BASE_COMMIT" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-repository "$BASE_REPOSITORY_URL" \
            --base-key tooling/contrib/myzephyr/keys/zephyr-backports-release.asc --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-key tooling/contrib/myzephyr/keys/myzephyr-maintainer.asc --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" \
            --out "$v/source-identity.txt"
          python3 -I tooling/contrib/myzephyr/zephyrd-check.py expected-version --checkout tooling > "$v/expected-version.txt"
          cat "$v/expected-version.txt"
      - name: Inspect the downloaded binary (static ELF checks; nothing is executed)
        run: tooling/contrib/myzephyr/check-elf.sh art/zephyrd "$RUNNER_TEMP/out/artifact-verification/elf-report.txt"
      - name: Verify the artifact against this run and the independent results
        run: |
          v="$RUNNER_TEMP/out/artifact-verification"
          printf '%s\n' --expected-commit "$MYZ_BUILD_SHA" --expected-version "$(cat "$v/expected-version.txt")" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --server-url "$GITHUB_SERVER_URL" \
            --event-name "$GITHUB_EVENT_NAME" --github-sha "$GITHUB_SHA" --pull-request "$MYZ_PULL_REQUEST" \
            --producer-job release-build --base-repository "$BASE_REPOSITORY_URL" --base-tag "$BASE_TAG" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-commit "$BASE_COMMIT" --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" --source-identity "$v/source-identity.txt" \
            --elf-report "$v/elf-report.txt" --recipe-dir tooling/contrib/myzephyr/linux > "$v/trusted-options.txt"
          mapfile -t opts < "$v/trusted-options.txt"
          python3 -I tooling/contrib/myzephyr/verify-artifact.py --artifact art "${opts[@]}" --report "$v/verify-artifact.json"
      - name: Artifact verifier self-test on this run's artifact (copies; nothing is executed)
        if: matrix.userland == 'ubuntu-24.04-host'
        run: |
          v="$RUNNER_TEMP/out/artifact-verification"
          mapfile -t opts < "$v/trusted-options.txt"
          python3 -I tooling/contrib/myzephyr/tests/artifact-verify-selftest.py "$RUNNER_TEMP/artifact-verify" \
            --artifact art -- "${opts[@]}" | tee "$v/selftest-real-artifact.txt"
          cp "$RUNNER_TEMP/artifact-verify/results.json" "$v/selftest-real-artifact.json"
      - name: Make the verified binary executable
        run: chmod 0755 art/zephyrd
      - name: Strict offline start on the runner
        if: matrix.userland == 'ubuntu-24.04-host'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I tooling/contrib/myzephyr/zephyrd-check.py offline --zephyrd art/zephyrd \
            --data-dir "$RUNNER_TEMP/data-offline" --log-dir "$RUNNER_TEMP/out/offline" \
            --expect-version "$(cat art/expected-version.txt)"
      - name: Strict offline start in the Debian 11 builder userland (glibc 2.31)
        if: matrix.userland == 'debian-11-builder-image'
        run: |
          docker build -t myzephyr-linux-builder:local -f tooling/contrib/myzephyr/linux/Dockerfile tooling/contrib/myzephyr/linux
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --network=none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/art:/art:ro" -v "$PWD/tooling/contrib/myzephyr:/harness:ro" -v "$RUNNER_TEMP/out:/out" \
            myzephyr-linux-builder:local sh -c 'ldd --version | head -n 1; python3 -I /harness/zephyrd-check.py offline --zephyrd /art/zephyrd --data-dir /tmp/data-offline --log-dir /out/offline --expect-version "$(cat /art/expected-version.txt)"'
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/out"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-offline-${{ matrix.userland }}-${{ env.MYZ_BUILD_SHA }}
          path: ${{ runner.temp }}/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  bootstrap:
    name: default public bootstrap (no peer options)
    needs: [tooling-selftest, release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the built commit with submodules (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: tooling
          fetch-depth: 1
          fetch-tags: false
          submodules: recursive
          persist-credentials: false
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zephyrd-linux-x86_64-${{ env.MYZ_BUILD_SHA }}
          path: art
      - name: Verify the source independently (base tag, own commits, head, tree)
        run: |
          v="$RUNNER_TEMP/out/artifact-verification"; mkdir -p "$v"
          bash tooling/contrib/myzephyr/ci-checkout.sh tooling "$v/checkout-record.txt"
          tooling/contrib/myzephyr/verify-source.sh --checkout tooling --expected-head "$MYZ_BUILD_SHA" \
            --base-tag "$BASE_TAG" --base-ref "refs/myzephyr-base/$BASE_TAG" --base-commit "$BASE_COMMIT" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-repository "$BASE_REPOSITORY_URL" \
            --base-key tooling/contrib/myzephyr/keys/zephyr-backports-release.asc --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-key tooling/contrib/myzephyr/keys/myzephyr-maintainer.asc --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" \
            --out "$v/source-identity.txt"
          python3 -I tooling/contrib/myzephyr/zephyrd-check.py expected-version --checkout tooling > "$v/expected-version.txt"
          cat "$v/expected-version.txt"
      - name: Inspect the downloaded binary (static ELF checks; nothing is executed)
        run: tooling/contrib/myzephyr/check-elf.sh art/zephyrd "$RUNNER_TEMP/out/artifact-verification/elf-report.txt"
      - name: Verify the artifact against this run and the independent results
        run: |
          v="$RUNNER_TEMP/out/artifact-verification"
          printf '%s\n' --expected-commit "$MYZ_BUILD_SHA" --expected-version "$(cat "$v/expected-version.txt")" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --server-url "$GITHUB_SERVER_URL" \
            --event-name "$GITHUB_EVENT_NAME" --github-sha "$GITHUB_SHA" --pull-request "$MYZ_PULL_REQUEST" \
            --producer-job release-build --base-repository "$BASE_REPOSITORY_URL" --base-tag "$BASE_TAG" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-commit "$BASE_COMMIT" --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" --source-identity "$v/source-identity.txt" \
            --elf-report "$v/elf-report.txt" --recipe-dir tooling/contrib/myzephyr/linux > "$v/trusted-options.txt"
          mapfile -t opts < "$v/trusted-options.txt"
          python3 -I tooling/contrib/myzephyr/verify-artifact.py --artifact art "${opts[@]}" --report "$v/verify-artifact.json"
      - name: Make the verified binary executable
        run: chmod 0755 art/zephyrd
      - name: Default discovery from an empty directory (handshake and validated height increase)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I tooling/contrib/myzephyr/zephyrd-check.py discovery --zephyrd art/zephyrd \
            --data-dir "$RUNNER_TEMP/data-discovery" --log-dir "$RUNNER_TEMP/out/discovery" \
            --expect-version "$(cat art/expected-version.txt)" --limit 600 --poll 15 --stop-on-pass
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/out"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-default-${{ env.MYZ_BUILD_SHA }}
          path: ${{ runner.temp }}/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  cross-build:
    name: cross build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-w64-mingw32]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the built commit with submodules (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: src-cross
          fetch-depth: 1
          fetch-tags: false
          submodules: recursive
          persist-credentials: false
      - name: Verify the source (base tag, own commits, head, tree)
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          bash src-cross/contrib/myzephyr/ci-checkout.sh src-cross "$out/checkout-record.txt"
          src-cross/contrib/myzephyr/verify-source.sh --checkout src-cross --expected-head "$MYZ_BUILD_SHA" \
            --base-tag "$BASE_TAG" --base-ref "refs/myzephyr-base/$BASE_TAG" --base-commit "$BASE_COMMIT" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-repository "$BASE_REPOSITORY_URL" \
            --base-key src-cross/contrib/myzephyr/keys/zephyr-backports-release.asc --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-key src-cross/contrib/myzephyr/keys/myzephyr-maintainer.asc --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" \
            --out "$out/source-identity.txt"
          cat "$out/source-identity.txt"
          python3 -I src-cross/contrib/myzephyr/zephyrd-check.py expected-version --checkout src-cross > "$out/expected-version.txt"
          cat "$out/expected-version.txt"
      - name: Build (depends, configure, target daemon) in the cross builder image
        run: JOBS=4 src-cross/contrib/myzephyr/cross/run-builder.sh docker "$TARGET" src-cross "$RUNNER_TEMP/out/build-logs"
      - name: Static checks of the cross-built binary (nothing is executed)
        run: |
          out="$RUNNER_TEMP/out"
          case "$TARGET" in
            aarch64-linux-gnu) bin=zephyrd; src-cross/contrib/myzephyr/check-elf.sh --arch aarch64 "src-cross/build/release-$TARGET/bin/$bin" "$out/static-report.txt" ;;
            x86_64-apple-darwin) bin=zephyrd; python3 -I src-cross/contrib/myzephyr/check-macho.py "src-cross/build/release-$TARGET/bin/$bin" "$out/static-report.txt" ;;
            aarch64-apple-darwin) bin=zephyrd; python3 -I src-cross/contrib/myzephyr/check-macho.py --arch arm64 "src-cross/build/release-$TARGET/bin/$bin" "$out/static-report.txt" ;;
            x86_64-w64-mingw32) bin=zephyrd.exe; python3 -I src-cross/contrib/myzephyr/check-pe.py "src-cross/build/release-$TARGET/bin/$bin" "$out/static-report.txt" ;;
          esac
          python3 -I src-cross/contrib/myzephyr/check-embedded.py "src-cross/build/release-$TARGET/bin/$bin" \
            "$(cat "$out/expected-version.txt")" "$out/embedded-report.txt"
      - name: Write manifest and stage artifact
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          case "$TARGET" in x86_64-w64-mingw32) bin=zephyrd.exe ;; *) bin=zephyrd ;; esac
          test -f "src-cross/build/release-$TARGET/bin/$bin" || { echo "no binary was built"; exit 1; }
          cp "src-cross/build/release-$TARGET/bin/$bin" "$out/$bin"
          python3 -I src-cross/contrib/myzephyr/make-cross-manifest.py --target "$TARGET" \
            --source-identity "$out/source-identity.txt" --expected-version "$out/expected-version.txt" \
            --builder-logs "$out/build-logs" --static-report "$out/static-report.txt" \
            --embedded-report "$out/embedded-report.txt" --binary "$out/$bin" \
            --build-dir "src-cross/build/release-$TARGET" --recipe-dir src-cross/contrib/myzephyr/cross \
            --checkout-record "$out/checkout-record.txt" --out "$out/manifest.json"
          ( cd "$out" && sha256sum "$bin" manifest.json expected-version.txt source-identity.txt > SHA256SUMS )
          cat "$out/SHA256SUMS"
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: python3 -I src-cross/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/out"
      - name: Upload cross-built artifact and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zephyrd-${{ matrix.target }}-${{ env.MYZ_BUILD_SHA }}
          path: ${{ runner.temp }}/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Name the binary hash for the run comparison
        id: hash
        run: |
          case "$TARGET" in aarch64-linux-gnu) plat=linux-aarch64 bin=zephyrd ;; x86_64-apple-darwin) plat=macos-x86_64 bin=zephyrd ;;
            aarch64-apple-darwin) plat=macos-arm64 bin=zephyrd ;; x86_64-w64-mingw32) plat=windows-x86_64 bin=zephyrd.exe ;; esac
          mkdir -p "$RUNNER_TEMP/marker"
          ( cd "$RUNNER_TEMP/out" && sha256sum "$bin" ) | tee "$RUNNER_TEMP/marker/binary-sha256.txt"
          echo "platform=$plat" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/marker/binary-sha256.txt")" >> "$GITHUB_OUTPUT"
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        run: python3 -I src-cross/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/marker"
      - name: Upload the hash marker (its name carries the hash; read by a later push run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-sha256-${{ steps.hash.outputs.platform }}-${{ steps.hash.outputs.sha256 }}
          path: ${{ runner.temp }}/marker
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  native-runtime:
    name: native runtime (${{ matrix.target }} on ${{ matrix.runner }})
    needs: [tooling-selftest, cross-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            exe: zephyrd
            py: python3
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            exe: zephyrd
            py: python3
          - target: aarch64-apple-darwin
            runner: macos-26
            exe: zephyrd
            py: python3
          - target: x86_64-w64-mingw32
            runner: windows-2022
            exe: zephyrd.exe
            py: python
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
      PY: ${{ matrix.py }}
    # Paths below are relative to the workspace on every OS; no step uses mapfile
    # (macOS /bin/bash is 3.2). The Linux AArch64 leg has a second strict offline start
    # in a runtime-only Debian 11 arm64 userland (contrib/myzephyr/runtime, the arm64
    # manifest of the builder base's index), by runtime-offline's container mechanism.
    steps:
      - name: Keep the checkout byte-identical on Windows (no CRLF conversion; long submodule paths)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - name: Check out the built commit with submodules (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: tooling
          fetch-depth: 1
          fetch-tags: false
          submodules: recursive
          persist-credentials: false
      - name: Record and require the tools this job uses (fails if one is missing)
        run: |
          mkdir -p out/artifact-verification
          {
            echo "runner=${{ matrix.runner }} os=$RUNNER_OS arch=$RUNNER_ARCH"
            uname -a
            echo "bash=$BASH_VERSION"
            git --version
            echo "git binary: $(command -v git)"
            echo "git gpg.program: $(git config --show-origin --get-all gpg.program || echo '(unset; verify-source.sh calls gpg itself)')"
            gpg --version | sed -n '1p;/^Home:/p'
            echo "gpg binary: $(command -v gpg)"
            echo "every gpg on PATH:"; type -a gpg
            t=$(mktemp -d)
            echo "temporary directory: $t"
            if command -v cygpath > /dev/null; then echo "native form: $(cygpath -m "$t") (cygpath -m), $(cygpath -w "$t") (cygpath -w)"; fi
            rmdir "$t"
            "$PY" --version
            if [ "$TARGET" = aarch64-linux-gnu ]; then
              readelf --version | head -n 1; objdump --version | head -n 1; file --version | head -n 1
            fi
          } | tee out/tools.txt
      - name: Download the cross-built artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zephyrd-${{ matrix.target }}-${{ env.MYZ_BUILD_SHA }}
          path: art
      - name: Verify the source independently (base tag, own commits, head, tree)
        run: |
          v=out/artifact-verification
          bash tooling/contrib/myzephyr/ci-checkout.sh tooling "$v/checkout-record.txt"
          bash tooling/contrib/myzephyr/verify-source.sh --checkout tooling --expected-head "$MYZ_BUILD_SHA" \
            --base-tag "$BASE_TAG" --base-ref "refs/myzephyr-base/$BASE_TAG" --base-commit "$BASE_COMMIT" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-repository "$BASE_REPOSITORY_URL" \
            --base-key tooling/contrib/myzephyr/keys/zephyr-backports-release.asc --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-key tooling/contrib/myzephyr/keys/myzephyr-maintainer.asc --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" \
            --out "$v/source-identity.txt"
          "$PY" -I tooling/contrib/myzephyr/zephyrd-check.py expected-version --checkout tooling > "$v/expected-version.txt"
          cat "$v/expected-version.txt"
      - name: Inspect the downloaded binary (own static checks; nothing is executed)
        run: |
          v=out/artifact-verification
          case "$TARGET" in
            aarch64-linux-gnu) bash tooling/contrib/myzephyr/check-elf.sh --arch aarch64 "art/$EXE" "$v/static-report.txt" ;;
            x86_64-apple-darwin) "$PY" -I tooling/contrib/myzephyr/check-macho.py "art/$EXE" "$v/static-report.txt" ;;
            aarch64-apple-darwin) "$PY" -I tooling/contrib/myzephyr/check-macho.py --arch arm64 "art/$EXE" "$v/static-report.txt" ;;
            x86_64-w64-mingw32) "$PY" -I tooling/contrib/myzephyr/check-pe.py "art/$EXE" "$v/static-report.txt" ;;
          esac
          "$PY" -I tooling/contrib/myzephyr/check-embedded.py "art/$EXE" "$(tr -d '\r\n' < "$v/expected-version.txt")" "$v/embedded-report.txt"
      - name: Verify the artifact against this run and the independent results
        run: |
          v=out/artifact-verification
          "$PY" -I tooling/contrib/myzephyr/verify-cross-artifact.py --target "$TARGET" --artifact art \
            --expected-commit "$MYZ_BUILD_SHA" --expected-version "$(tr -d '\r\n' < "$v/expected-version.txt")" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --server-url "$GITHUB_SERVER_URL" \
            --event-name "$GITHUB_EVENT_NAME" --github-sha "$GITHUB_SHA" --pull-request "$MYZ_PULL_REQUEST" \
            --producer-job cross-build --base-repository "$BASE_REPOSITORY_URL" --base-tag "$BASE_TAG" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-commit "$BASE_COMMIT" --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" --source-identity "$v/source-identity.txt" \
            --static-report "$v/static-report.txt" --embedded-report "$v/embedded-report.txt" \
            --recipe-dir tooling/contrib/myzephyr/cross --report "$v/verify-cross-artifact.json"
      - name: Platform self-test of the start checks (stub child, this OS's stop mechanism)
        run: '"$PY" -I tooling/contrib/myzephyr/tests/platform-selftest.py out/platform-selftest'
      - name: Version output of the verified binary
        run: |
          chmod 0755 "art/$EXE"
          "art/$EXE" --version > out/version.txt
          cat out/version.txt
          v=$(tr -d '\r\n' < art/expected-version.txt)
          test "$(wc -l < out/version.txt | tr -d ' ')" = 1
          [[ "$(tr -d '\r\n' < out/version.txt)" == "Zephyr '"*"' (v$v)" ]]
      - name: Strict offline start with clean shutdown and no listener left
        run: |
          "$PY" -I tooling/contrib/myzephyr/zephyrd-check.py offline --zephyrd "art/$EXE" \
            --data-dir data-offline --log-dir out/offline --expect-version "$(tr -d '\r\n' < art/expected-version.txt)"
      - name: Strict offline start in a runtime-only Debian 11 arm64 userland (glibc 2.31)
        if: matrix.target == 'aarch64-linux-gnu'
        run: |
          docker build -t myzephyr-runtime-arm64:local -f tooling/contrib/myzephyr/runtime/Dockerfile tooling/contrib/myzephyr/runtime
          docker run --rm --network=none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/art:/art:ro" -v "$PWD/tooling/contrib/myzephyr:/harness:ro" -v "$PWD/out:/out" \
            myzephyr-runtime-arm64:local sh -c '
              set -e
              ldd --version | head -n 1 > /out/debian-11-arm64-userland.txt
              { echo "debian_version $(cat /etc/debian_version)"; echo "architecture $(dpkg --print-architecture)"
                echo "python3 $(python3 --version)"; } >> /out/debian-11-arm64-userland.txt
              cp /runtime-apt-state.txt /runtime-packages.tsv /out/
              cat /out/debian-11-arm64-userland.txt
              head -n 1 /out/debian-11-arm64-userland.txt | grep -q " 2\.31$"
              python3 -I /harness/zephyrd-check.py offline --zephyrd /art/zephyrd --data-dir /tmp/data-offline \
                --log-dir /out/offline-debian-11-arm64 --expect-version "$(tr -d "\r\n" < /art/expected-version.txt)"'
      - name: Default discovery from an empty directory (no peer options)
        run: |
          "$PY" -I tooling/contrib/myzephyr/zephyrd-check.py discovery --zephyrd "art/$EXE" \
            --data-dir data-discovery --log-dir out/discovery \
            --expect-version "$(tr -d '\r\n' < art/expected-version.txt)" --limit 600 --poll 15 --stop-on-pass
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: $PY -I tooling/contrib/myzephyr/check-upload-paths.py --allow-missing "out"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-${{ matrix.target }}-${{ env.MYZ_BUILD_SHA }}
          path: out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  package:
    name: package the release set (five archives, manifests, SHA256SUMS)
    needs: [tooling-selftest, release-build, unit-tests, runtime-offline, bootstrap, cross-build, native-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the built commit with submodules (depth 1, no tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MYZ_BUILD_SHA }}
          path: tooling
          fetch-depth: 1
          fetch-tags: false
          submodules: recursive
          persist-credentials: false
      - name: Verify the source independently (base tag, own commits, head, tree)
        run: |
          v="$RUNNER_TEMP/out/artifact-verification"; mkdir -p "$v"
          bash tooling/contrib/myzephyr/ci-checkout.sh tooling "$v/checkout-record.txt"
          tooling/contrib/myzephyr/verify-source.sh --checkout tooling --expected-head "$MYZ_BUILD_SHA" \
            --base-tag "$BASE_TAG" --base-ref "refs/myzephyr-base/$BASE_TAG" --base-commit "$BASE_COMMIT" \
            --base-tag-object "$BASE_TAG_OBJECT" --base-repository "$BASE_REPOSITORY_URL" \
            --base-key tooling/contrib/myzephyr/keys/zephyr-backports-release.asc --base-fingerprint "$BASE_FINGERPRINT" \
            --maintainer-key tooling/contrib/myzephyr/keys/myzephyr-maintainer.asc --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" \
            --out "$v/source-identity.txt"
          python3 -I tooling/contrib/myzephyr/zephyrd-check.py expected-version --checkout tooling > "$v/expected-version.txt"
          cat "$v/expected-version.txt"
      - name: Download the five build artifacts of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zephyrd-*-${{ env.MYZ_BUILD_SHA }}
          path: art
      - name: Verify every artifact again, as the consumer jobs do (static checks, then the verifier)
        run: |
          v="$RUNNER_TEMP/out/artifact-verification"
          ver=$(cat "$v/expected-version.txt")
          common=(--expected-commit "$MYZ_BUILD_SHA" --expected-version "$ver" --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF"
            --workflow-ref "$GITHUB_WORKFLOW_REF" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
            --server-url "$GITHUB_SERVER_URL" --event-name "$GITHUB_EVENT_NAME" --github-sha "$GITHUB_SHA"
            --pull-request "$MYZ_PULL_REQUEST" --base-repository "$BASE_REPOSITORY_URL" --base-tag "$BASE_TAG"
            --base-tag-object "$BASE_TAG_OBJECT" --base-commit "$BASE_COMMIT" --base-fingerprint "$BASE_FINGERPRINT"
            --maintainer-fingerprint "$MAINTAINER_FINGERPRINT" --source-identity "$v/source-identity.txt")
          a=art/zephyrd-linux-x86_64-$MYZ_BUILD_SHA
          tooling/contrib/myzephyr/check-elf.sh "$a/zephyrd" "$v/elf-report-linux-x86_64.txt"
          python3 -I tooling/contrib/myzephyr/verify-artifact.py --artifact "$a" "${common[@]}" \
            --elf-report "$v/elf-report-linux-x86_64.txt" --recipe-dir tooling/contrib/myzephyr/linux \
            --report "$v/verify-linux-x86_64.json"
          for t in aarch64-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-w64-mingw32; do
            a=art/zephyrd-$t-$MYZ_BUILD_SHA
            case "$t" in
              aarch64-linux-gnu) b=zephyrd; tooling/contrib/myzephyr/check-elf.sh --arch aarch64 "$a/$b" "$v/static-$t.txt" ;;
              x86_64-apple-darwin) b=zephyrd; python3 -I tooling/contrib/myzephyr/check-macho.py "$a/$b" "$v/static-$t.txt" ;;
              aarch64-apple-darwin) b=zephyrd; python3 -I tooling/contrib/myzephyr/check-macho.py --arch arm64 "$a/$b" "$v/static-$t.txt" ;;
              x86_64-w64-mingw32) b=zephyrd.exe; python3 -I tooling/contrib/myzephyr/check-pe.py "$a/$b" "$v/static-$t.txt" ;;
            esac
            python3 -I tooling/contrib/myzephyr/check-embedded.py "$a/$b" "$ver" "$v/embedded-$t.txt"
            python3 -I tooling/contrib/myzephyr/verify-cross-artifact.py --target "$t" --artifact "$a" "${common[@]}" \
              --producer-job cross-build --static-report "$v/static-$t.txt" --embedded-report "$v/embedded-$t.txt" \
              --recipe-dir tooling/contrib/myzephyr/cross --report "$v/verify-$t.json"
          done
      - name: Make the release set (archives, manifests, SHA256SUMS; read back and checked)
        run: |
          python3 -I tooling/contrib/myzephyr/release/make-release-set.py --checkout tooling --out release-set \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --artifact "linux-x86_64=art/zephyrd-linux-x86_64-$MYZ_BUILD_SHA" \
            --artifact "linux-aarch64=art/zephyrd-aarch64-linux-gnu-$MYZ_BUILD_SHA" \
            --artifact "macos-x86_64=art/zephyrd-x86_64-apple-darwin-$MYZ_BUILD_SHA" \
            --artifact "macos-arm64=art/zephyrd-aarch64-apple-darwin-$MYZ_BUILD_SHA" \
            --artifact "windows-x86_64=art/zephyrd-x86_64-w64-mingw32-$MYZ_BUILD_SHA"
          { echo "### Release set of $MYZ_BUILD_SHA"; echo; echo '```'; cat release-set/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Compare with the pull-request run of the same commit (reported, not a gate)
        if: github.event_name == 'push'
        run: |
          sums=()
          for f in release-set/*.manifest.json; do
            sums+=("$(python3 -I -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["platform"] + "=" + m["binary"]["sha256"])' "$f")")
          done
          python3 -I tooling/contrib/myzephyr/release/compare-pr-run.py --repository "$GITHUB_REPOSITORY" \
            --commit "$MYZ_BUILD_SHA" --run-id "$GITHUB_RUN_ID" --sums "${sums[@]}" --summary "$GITHUB_STEP_SUMMARY"
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        run: python3 -I tooling/contrib/myzephyr/check-upload-paths.py --allow-missing "release-set"
      - name: Upload the release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set-${{ env.MYZ_BUILD_SHA }}
          path: release-set
          retention-days: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/my/')) && 90 || env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Check the paths to upload (characters actions/upload-artifact refuses)
        if: always()
        run: python3 -I tooling/contrib/myzephyr/check-upload-paths.py --allow-missing "$RUNNER_TEMP/out"
      - name: Upload the verification records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-records-${{ env.MYZ_BUILD_SHA }}
          path: ${{ runner.temp }}/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
