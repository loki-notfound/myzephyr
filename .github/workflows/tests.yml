# Calls the reusable unit-test workflow from the home repo. Builds this tree with BUILD_TESTS=ON
# and runs Monero's unit tests, which must keep passing above the upstream tag. See
# https://github.com/zephyr-backports/zephyr-backports/blob/main/docs/POLICY.md
name: tests
on:
  push:
    # myzephyr: the dedicated workflow covers ci/daemon-release-baseline and my/**; with only a branch
    # filter set, tag pushes do not start this workflow (unchanged).
    branches-ignore: [ci/daemon-release-baseline, "my/**"]
  pull_request:
    branches-ignore: ["my/**"]
jobs:
  tests:
    uses: zephyr-backports/zephyr-backports/.github/workflows/tests.yml@main
